name: WeTube Native Windows gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wetube-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test runtime probe helpers
        run: python -m unittest discover -s tools -p test_runtime_probe.py -v
      - name: Verify committed source and export independently of build
        run: python tools/verify_source.py WeTube-Desktop-Native-v09-checkpoint-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wetube-native-full-source
          path: WeTube-Desktop-Native-v09-checkpoint-source.zip
          if-no-files-found: error
  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: native-src
    steps:
      - shell: pwsh
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify same commit before build
        working-directory: .
        run: python tools/verify_source.py verify-before-build.zip
      - uses: dtolnay/rust-toolchain@stable
      - name: Show Rust version
        run: |
          New-Item -ItemType Directory -Force ../ci-evidence | Out-Null
          rustc -Vv | Tee-Object ../ci-evidence/rustc.log
          cargo -V | Tee-Object ../ci-evidence/cargo.log
      - name: Cargo check locked
        run: |
          cargo check --locked 2>&1 | Tee-Object ../ci-evidence/check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cargo test locked
        run: |
          cargo test --locked 2>&1 | Tee-Object ../ci-evidence/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cargo build locked release
        run: |
          cargo build --release --locked 2>&1 | Tee-Object ../ci-evidence/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash executable
        run: Get-FileHash target/release/wetube.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: wetube-native-executable-no-runtime
          path: native-src/target/release/wetube.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wetube-native-build-evidence
          path: ci-evidence/
          if-no-files-found: warn
  runtime:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z
      MPV_SHA256: 273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify pinned runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-evidence, runtime-private | Out-Null
          Invoke-WebRequest -Uri $env:MPV_URL -OutFile runtime-private/mpv.7z
          $hash = (Get-FileHash runtime-private/mpv.7z -Algorithm SHA256).Hash.ToLower()
          $hash | Set-Content runtime-evidence/archive-sha256.txt
          if ($hash -ne $env:MPV_SHA256) { throw "libmpv archive hash mismatch" }
          7z e -y runtime-private/mpv.7z libmpv-2.dll -oruntime-private
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path runtime-private/libmpv-2.dll -PathType Leaf)) { throw "libmpv DLL missing" }
      - name: Offline libmpv probe
        shell: pwsh
        run: |
          python tools/runtime_probe.py runtime-private/libmpv-2.dll 2>&1 | Tee-Object runtime-evidence/probe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wetube-libmpv-probe-evidence
          path: runtime-evidence/
          if-no-files-found: warn

  installer:
    needs: [windows, runtime]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wetube-native-executable-no-runtime
          path: native-src/target/release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile online installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 compiler missing' }
          & $iscc native-src/installer/wetube.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and test the exact candidate
        shell: pwsh
        run: ./tools/test_installer.ps1
      - name: Require complete offline acceptance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reports = @('branding.json','renderer.json','motion.json','gui-startup.json','install.json','uninstall.json')
          foreach ($name in $reports) {
            $path = Join-Path installer-evidence $name
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing required evidence: $name" }
            $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            if ($report.status -ne 'PASS') { throw "Acceptance evidence not PASS: $name" }
          }
          $motion = Get-Content installer-evidence/motion.json -Raw | ConvertFrom-Json
          if ($motion.distinct_frames -ne $true -or $motion.seek_confirmed -ne $true) { throw 'Motion/seek evidence incomplete' }
          $uninstall = Get-Content installer-evidence/uninstall.json -Raw | ConvertFrom-Json
          if ($uninstall.app_binaries_removed -ne $true) { throw 'Uninstall evidence incomplete' }
          Write-Host 'Offline installer acceptance: all six reports PASS. Online playback and clean GPU acceptance are separate gates.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wetube-installer-test-evidence
          path: installer-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: wetube-windows-x64-online-setup
          path: native-src/dist/*-setup.exe
          if-no-files-found: error

  offline-acceptance:
    name: Required offline acceptance
    if: ${{ always() }}
    needs: [source, windows, runtime, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_RESULT: ${{ needs.source.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      RUNTIME_RESULT: ${{ needs.runtime.result }}
      INSTALLER_RESULT: ${{ needs.installer.result }}
    steps:
      - name: Reject failed, skipped or cancelled mandatory jobs
        shell: bash
        run: |
          set -eu
          for gate in SOURCE_RESULT WINDOWS_RESULT RUNTIME_RESULT INSTALLER_RESULT; do
            result="${!gate}"
            printf '%s=%s\n' "$gate" "$result"
            if [ "$result" != success ]; then exit 1; fi
          done
          echo "Offline CI PASS; real YouTube, clean Windows Vulkan, UI interaction and screenshots remain separate acceptance gates."
