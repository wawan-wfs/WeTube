# Link the C runtime statically on Windows, so the app starts on PCs that don't
# have the Visual C++ Redistributable installed (VCRUNTIME140.dll)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
